---
# Host lifecycle marker. Set this in group_vars or host_vars.
# Supported values: present, absent, unmanaged.
keepalived_state: unmanaged

# The package name is equal in used distributions.
keepalived_package_name: keepalived
keepalived_service_name: keepalived
keepalived_config_path: /etc/keepalived/keepalived.conf

# Defaults to the connection address from inventory. Define this explicitly in
# host_vars only when Keepalived must use a different local address.
keepalived_node_address: "{{ ansible_host | default(inventory_hostname) }}"

# Set this to an existing inventory group to discover unicast peers from its
# ansible_host values. A host_vars keepalived_peer_addresses list overrides
# the discovered list for exceptional hosts.
keepalived_peer_group: ""
keepalived_peer_addresses: >-
  {{
    (
      groups[keepalived_peer_group]
      | reject('equalto', inventory_hostname)
      | map('extract', hostvars, 'ansible_host')
      | list
    )
    if (keepalived_peer_group | length > 0)
    else []
  }}

# Optional text written at the beginning of keepalived.conf, for example:
# keepalived_config_header: |
#   # Managed by Ansible
keepalived_config_header: "# This file is managed by Ansible."

# Structured Keepalived configuration. See README.md for inventory examples.
keepalived_global_defs: {}
keepalived_vrrp_scripts: []
keepalived_vrrp_instances: []

# Scripts without their own user run under this dedicated system account.
keepalived_script_user: keepalived_script
keepalived_manage_script_user: true

# All instances start as BACKUP and participate in the initial election by
# priority. nopreempt prevents a recovered higher-priority node from taking
# ownership back from a healthy active node.
keepalived_vrrp_default_state: BACKUP
keepalived_vrrp_default_nopreempt: true
